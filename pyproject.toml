[project]
name = "paisalens"
version = "0.1.0"
description = "Ask questions about your own money in plain English and get exact, checkable numbers."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3,<3",
    "fastapi>=0.110",
    "pdfplumber>=0.11",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "sqlglot>=30,<31",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "reportlab>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.sql" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
